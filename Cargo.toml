[package]
name = "tavily-mcp-rs"
version = "0.1.0"
edition = "2021"
description = "MCP server for advanced web search using Tavily, implemented in Rust"
authors = ["Tavily"]
license = "MIT"

[dependencies]
tokio = { version = "1.36.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4.4", features = ["derive"] }
dotenv = "0.15"
env_logger = "0.10"
log = "0.4"
async-trait = "0.1"
futures = "0.3"
